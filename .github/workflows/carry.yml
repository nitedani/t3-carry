name: carry
# The dashboard finds its request's newest run by this name.
run-name: "carry #${{ github.event.issue.number || 'nightly' }}"

# Builds upstream T3 nightlies with the PRs each machine picked (README.md).
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    # Both before t3-update's 04:30 Europe/Budapest run, summer and winter; the second retries what the first didn't build.
    # The dashboard (claude-swap's carry.ts, nightDue) expects their run by 03:00 UTC, GitHub's delay included.
    - cron: "50 0 * * *"
    - cron: "50 1 * * *"
  workflow_dispatch:

permissions: {}

# A newer edit of a request cancels that request's running or waiting run; scheduled and manual runs queue behind each other.
concurrency:
  group: carry-${{ github.event.issue.number || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

env:
  GH_REPO: ${{ github.repository }}
  UPSTREAM: pingdotgg/t3code
  # The machines' gh logins; other authors' issues are not requests.
  REQUESTERS: '["nitedani","nitedani-agent"]'
  # An upstream PR, or <login>/t3code#<n>: an open PR on the requester's own fork, which takes no resolution.
  PICK: "^pick ([1-9][0-9]{0,6} [0-9a-f]{40}( [0-9a-f]{40})?|[A-Za-z0-9-]+/t3code#[1-9][0-9]{0,6} [0-9a-f]{40})$"
  # resolves <sha> <res> <tip>: res holds the pick, and its own first-parent line (what neither tip nor the pick has) starts
  # with a merge and merges only the pick or code already in tip, so a resolution made over a pick that is gone can't bring
  # it back. The plan's check and the build's apply both run it.
  RESOLVES: |
    resolves() {
      local sha=$1 res=$2 tip=$3 others parent lowest=''
      git merge-base --is-ancestor "$sha" "$res" || return 1
      while read -r _ _ others; do
        lowest=$others
        for parent in $others; do
          [ "$parent" = "$sha" ] || git merge-base --is-ancestor "$parent" "$tip" || return 1
        done
      done < <(git rev-list --first-parent --parents "$res" "^$tip" "^$sha")
      [ -n "$lowest" ]
    }

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      # The request an issue event is for; a scheduled or manual run builds every request.
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      keys: ${{ steps.plan.outputs.keys }}
      work: ${{ steps.plan.outputs.work }}
    steps:
      - id: plan
        name: Read the requests, what upstream says of each pick, and the newest nightly
        run: |
          set -euo pipefail
          eval "$RESOLVES"
          version=$(gh api "repos/$UPSTREAM/releases?per_page=50" --jq '[.[] | select(.draft | not)
            | select(.tag_name | test("^v[0-9.]+-nightly\\.[0-9]{8}\\.[0-9]+$"))] | sort_by(.published_at) | last | .tag_name // "" | ltrimstr("v")')
          [ -n "$version" ] || { echo "::error::no nightly release on $UPSTREAM"; exit 1; }
          echo "newest nightly: $version"

          # One pick (pr, sha, res) and its PR's facts. merged: its merge commit is in the nightly (upstream squash-merges,
          # so the picked sha never is); an own pick never is. pinned: sha is the PR's.
          facts() {
            local pr=$1 sha=$2 res=$3 repo=$UPSTREAM n=$1 pull merged=false pinned=false
            if [[ $pr == */* ]]; then repo=${pr%#*} n=${pr#*#}; fi
            pull=$(gh api "repos/$repo/pulls/$n")
            if [ "$repo" = "$UPSTREAM" ] && [ "$(jq -r .merged <<<"$pull")" = true ]; then
              case $(gh api "repos/$UPSTREAM/compare/$(jq -r .merge_commit_sha <<<"$pull")...v$version" --jq .status) in
                ahead | identical) merged=true ;;
              esac
            fi
            if gh api --paginate "repos/$repo/pulls/$n/commits?per_page=100" --jq '.[].sha' | grep -x "$sha" >/dev/null; then pinned=true; fi
            jq -c --arg pr "$pr" --arg sha "$sha" --arg res "$res" --argjson merged "$merged" --argjson pinned "$pinned" \
              '{pr: ($pr | tonumber? // .), $sha, res: (if $res == "" then null else $res end), $merged, $pinned}' <<<"$pull"
          }

          # The build's apply as a merge-tree chain in a blobless clone, for the request with key $1: true when each pinned,
          # unmerged pick merges onto the nightly over the picks before it. The dashboard checks a pick set the same way.
          applies() {
            local request author pr sha res tip tree rc ok=0 GIT_DIR=$RUNNER_TEMP/check-$1
            export GIT_DIR
            request=$(jq -c --arg key "$1" '.[] | select(.key == $key)' requests.json)
            author=$(jq -r .author <<<"$request")
            git init -q --bare && git remote add origin "https://github.com/$UPSTREAM.git" &&
              git fetch -q --filter=blob:none --no-tags origin "+refs/tags/v$version:refs/tags/v$version" &&
              tip=$(git rev-parse "v$version^{commit}") || exit 1
            while read -r pr sha res; do
              # An own pick is fetched from its fork with its blobs, which upstream doesn't have.
              case $pr in
                */*) git fetch -q --no-tags "https://github.com/${pr%#*}.git" "$sha" || exit 1 ;;
                *) git fetch -q --filter=blob:none --no-tags origin "$sha" || exit 1 ;;
              esac
              if [ -n "$res" ]; then
                git fetch -q --no-tags "https://github.com/$author/t3code.git" "$res" || echo "::warning::$res is not on $author/t3code"
                if ! resolves "$sha" "$res" "$tip"; then
                  echo "::warning::#$pr: $res is not a resolution of $sha onto tonight's tree"; ok=1; continue
                fi
              fi
              rc=0 && tree=$(git merge-tree --write-tree --no-messages "$tip" "${res:-$sha}") || rc=$?
              case $rc in
                0) tip=$(git -c user.name=carry -c user.email=carry@users.noreply.github.com commit-tree -p "$tip" -p "${res:-$sha}" -m "carry #$pr" "$tree") || exit 1 ;;
                1) echo "::warning::#$pr: ${res:-$sha} conflicts with the nightly or an earlier pick"; ok=1 ;;
                *) exit 1 ;;
              esac
            done < <(jq -r '.picks[] | select(.pinned and (.merged | not)) | "\(.pr) \(.sha) \(.res // "")"' <<<"$request")
            return $ok
          }

          : > requests.jsonl
          : > wanted
          gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" |
            jq -c --argjson who "$REQUESTERS" '.[] | select(.pull_request == null and (.user.login | IN($who[]))) | {number, author: .user.login, body: (.body // "")}' > issues.jsonl
          while IFS= read -r issue; do
            n=$(jq -r .number <<<"$issue") author=$(jq -r .author <<<"$issue")
            body=$(jq -r .body <<<"$issue" | tr -d '\r')
            picks=$(grep -E "$PICK" <<<"$body" | LC_ALL=C sort -k2,2n) || true
            if grep -vqE "$PICK|^\$" <<<"$body"; then echo "::error::#$n: a line is not 'pick <pr> <sha40> [<res40>]' or 'pick <login>/t3code#<pr> <sha40>'"; continue
            elif grep -vqE "^(pick ([1-9][0-9]* |$author/t3code#)|\$)" <<<"$picks"; then echo "::error::#$n: an own pick is not on $author/t3code"; continue
            elif [ "$(grep -c . <<<"$picks")" -gt 10 ]; then echo "::error::#$n: more than 10 picks"; continue
            elif [ -n "$(cut -d' ' -f2 <<<"$picks" | uniq -d)" ]; then echo "::error::#$n: a PR is picked twice"; continue
            fi
            [ -n "$picks" ] || { echo "#$n: no picks"; continue; }
            # t3-update computes the key with this same line.
            key=$(printf '%s\n' "$picks" | sha256sum | cut -c1-16)
            echo "#$n: key $key"
            while read -r _ pr sha res; do facts "$pr" "$sha" "$res"; done <<<"$picks" |
              jq -sc --arg key "$key" --arg author "$author" '{$key, $author, picks: .}' >> requests.jsonl
            if [ -z "$ISSUE" ] || [ "$n" = "$ISSUE" ]; then echo "$key" >> wanted; fi
          done < issues.jsonl

          echo '[]' > work.json
          jq -sc 'unique_by(.key)' requests.jsonl > requests.json
          # A key is built only when every pick applies, since a machine installs only a build that carries all its picks: a
          # pick that doesn't waits for a Resolve press. An issue event's run builds only its request.
          mapfile -t keys < <(sort -u wanted)
          for key in "${keys[@]}"; do
            if gh release view "c/$key/v$version.c$key" --json assets --jq '.assets[].name' 2>/dev/null | grep -x SHA256SUMS >/dev/null; then
              echo "c/$key/v$version.c$key: built"
            elif ! applies "$key"; then
              echo "::warning::c/$key/v$version.c$key: not built, since a pick doesn't apply"
            else
              jq -c --arg key "$key" --slurpfile r requests.json '. + [$r[0][] | select(.key == $key)]' work.json > w && mv w work.json
            fi
          done
          {
            echo "version=$version"
            echo "keys=$(jq -c 'map(.key)' requests.json)"
            echo "work=$(cat work.json)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.key }}
    needs: plan
    if: needs.plan.outputs.work != '[]'
    # An issue run and a scheduled or manual run may both build one key; they take turns, and the second keeps the release.
    concurrency:
      group: carry-key-${{ matrix.key }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.work) }}
    env:
      KEY: ${{ matrix.key }}
      AUTHOR: ${{ matrix.author }}
      PICKS: ${{ toJSON(matrix.picks) }}
      V: ${{ needs.plan.outputs.version }}
      # The carried build's own version: above V and below the next nightly, so it never shares V's install.
      VC: ${{ needs.plan.outputs.version }}.c${{ matrix.key }}
      INSTALL_ARGS: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Check out the nightly and fetch the picks
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$UPSTREAM.git"
          git fetch -q --filter=blob:none --no-tags origin "+refs/tags/v$V:refs/tags/v$V"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach "v$V"
          git config user.name carry
          git config user.email carry@users.noreply.github.com
          # An own pick is fetched from its fork with its blobs, which upstream doesn't have.
          while read -r pr sha; do
            case $pr in
              */*) git fetch -q --no-tags "https://github.com/${pr%#*}.git" "$sha" ;;
              *) git fetch -q --filter=blob:none --no-tags origin "$sha" ;;
            esac
          done < <(jq -r '.[] | select(.pinned and (.merged | not)) | "\(.pr) \(.sha)"' <<<"$PICKS")
          # A resolution is read only from the requester's own fork, with its blobs, which upstream doesn't have.
          for res in $(jq -r '.[] | select(.pinned and (.merged | not)) | .res // empty' <<<"$PICKS"); do
            git fetch -q --no-tags "https://github.com/$AUTHOR/t3code.git" "$res" || echo "::warning::$res is not on $AUTHOR/t3code"
          done
          grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_ENV"

      # From here: release.yml's build_bundle and release-desktop.yml's Linux x64 CLI archive, at the nightly.
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.INSTALL_ARGS }}

      - name: Install patchelf
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      - name: Apply each pick, then build
        run: |
          set -uo pipefail
          # Each line of $RUNNER_TEMP/states is "<pr> <state> [<cause>]"; a later line overrides an earlier one.
          state() { echo "$*" >> "$RUNNER_TEMP/states"; }
          for pr in $(jq -r '.[] | select(.merged) | .pr' <<<"$PICKS"); do state "$pr" merged; done
          for pr in $(jq -r '.[] | select(.pinned or .merged | not) | .pr' <<<"$PICKS"); do state "$pr" unpinned; done

          eval "$RESOLVES"
          # The nightly with the picks merged in PR order, each by its resolution if it has one; one that conflicts is left
          # out. applied: the picks merged; resolved: the shas of those merged by a resolution.
          apply() {
            local pr sha res
            applied=() resolved=()
            git checkout -qf --detach "v$V" && git clean -ffdxq -e node_modules || exit 1
            for pr in "$@"; do
              read -r sha res < <(jq -r --arg pr "$pr" '.[] | select(.pr | tostring == $pr) | "\(.sha) \(.res // "")"' <<<"$PICKS")
              if [ -n "$res" ] && ! resolves "$sha" "$res" HEAD; then
                echo "::warning::#$pr: $res is not a resolution of $sha onto tonight's tree"; state "$pr" doesnt-apply
              elif git merge -q --no-edit -m "carry #$pr at $sha" "${res:-$sha}"; then
                applied+=("$pr")
                [ -z "$res" ] || resolved+=("$sha")
              else git merge --abort; state "$pr" doesnt-apply
              fi
            done
          }
          # Each test file runs inside its own package with `vp test run <files>`, as upstream's windows-tests.yml runs chosen
          # files: from the repo root its config loads every package's, apps/mobile's too, which this build doesn't install.
          # A package this build doesn't install ships nothing in it, so its tests are skipped.
          run_tests() {
            local f d
            local -A files=()
            for f; do
              d=$(dirname "$f")
              while [ "$d" != . ] && [ ! -f "$d/package.json" ]; do d=$(dirname "$d"); done
              files[$d]+=" ${f#"$d"/}"
            done
            for d in "${!files[@]}"; do
              if [ ! -d "$d/node_modules" ]; then echo "not built here, tests skipped:${files[$d]}"; continue; fi
              # shellcheck disable=SC2086 # each file is its own argument
              (cd "$d" && vp test run ${files[$d]}) || return
            done
          }
          # A probe build (probe=1) keeps no archive.
          build() {
            local tests sha
            echo "::group::build: the nightly and ${applied[*]:-no pick}"
            # The test files a resolved pick changes.
            mapfile -t tests < <(for sha in "${resolved[@]}"; do git diff --name-only --diff-filter=d "v$V...$sha"; done | grep -E '\.test\.tsx?$' | sort -u)
            # shellcheck disable=SC2086 # each filter is its own argument
            vp install $INSTALL_ARGS &&
              node scripts/update-release-package-versions.ts "$VC" &&
              vp run --filter 't3...' --filter '@t3tools/web...' typecheck &&
              run_tests "${tests[@]}" &&
              vp run build:desktop:bundle &&
              node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client &&
              cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu &&
              mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64" &&
              cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/" &&
              node apps/server/scripts/cli.ts build-exe --verbose &&
              node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VC" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli &&
              node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$VC-linux-x64.tar.gz" --expect-version "$VC" &&
              { [ -n "${probe-}" ] || cp "release-cli/t3-$VC-linux-x64.tar.gz" "$RUNNER_TEMP/"; }
            local rc=$?
            echo "::endgroup::"
            return $rc
          }
          # Sets cause for pick $1, which doesn't build over the kept picks: alone when it fails over the nightly alone, else the
          # last pick of a leading run of kept picks it fails over, found by halving the run.
          blame() {
            local lo=0 hi=${#kept[@]} mid
            cause=alone
            ((hi > 0)) || return 0
            apply "$1"
            if [ ${#applied[@]} -gt 0 ] && ! probe=1 build; then return 0; fi
            while ((hi - lo > 1)); do
              mid=$(((lo + hi) / 2))
              apply "${kept[@]:0:mid}" "$1"
              if [ ${#applied[@]} -gt "$mid" ] && ! probe=1 build; then hi=$mid; else lo=$mid; fi
            done
            cause=${kept[hi - 1]}
          }

          mapfile -t candidates < <(jq -r '.[] | select(.pinned and (.merged | not)) | .pr' <<<"$PICKS")
          apply "${candidates[@]}"
          if [ ${#applied[@]} -gt 0 ] && ! build; then
            # The nightly alone, then in PR order each pick over the picks kept so far, which a resolution was made over;
            # a pick is kept when that builds. The last build that passed left its archive in $RUNNER_TEMP.
            together=("${applied[@]}") kept=()
            for pr in "${together[@]}"; do state "$pr" doesnt-build; done
            apply
            if build; then
              for pr in "${together[@]}"; do
                apply "${kept[@]}" "$pr"
                if [ ${#applied[@]} -gt ${#kept[@]} ]; then
                  if build; then kept+=("$pr"); else blame "$pr"; state "$pr" doesnt-build "$cause"; fi
                fi
              done
            else
              echo broken > "$RUNNER_TEMP/recipe"
            fi
            applied=("${kept[@]}")
          fi
          for pr in "${applied[@]}"; do state "$pr" carried; done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          archive=t3-$VC-linux-x64.tar.gz assets=() recipe=$(cat "$RUNNER_TEMP/recipe" 2>/dev/null || echo ok)
          jq -n --arg nightly "$V" --arg version "$VC" --arg recipe "$recipe" --argjson picks "$PICKS" --arg run "$RUN_URL" --rawfile states "$RUNNER_TEMP/states" '
            ($states | split("\n") | map(select(. != "") | split(" ")
              | {(.[0]): {state: .[1], cause: (.[2] | tonumber? // .)}}) | add) as $s
            | [$picks[] | {pr, sha, res} + $s[.pr | tostring]] as $p
            | {schema: 3, $nightly, $version, state: (if any($p[]; .state == "carried") then "built" else "not-built" end),
               $recipe, picks: $p, $run}' > carry.json
          cat carry.json
          if [ "$(jq -r .state carry.json)" = built ]; then
            (cd "$RUNNER_TEMP" && sha256sum "$archive") > SHA256SUMS
            assets=("$RUNNER_TEMP/$archive" SHA256SUMS)
          fi
          tag=c/$KEY/v$VC
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -x SHA256SUMS >/dev/null; then
            echo "$tag: another run published it, kept"; exit 0
          elif gh release view "$tag" >/dev/null 2>&1; then gh release delete "$tag" --cleanup-tag --yes; fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$(jq -r '[.picks[] | "#\(.pr)@\(.sha[:9]) \(.state)"] | join(", ")' carry.json) on $VC" \
            --notes-file carry.json carry.json ${assets[@]+"${assets[@]}"}

  keepalive:
    # GitHub disables a public repo's schedules after 60 days without activity; re-enabling the workflow needs no commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/carry.yml/enable"

  prune:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEYS: ${{ needs.plan.outputs.keys }}
    steps:
      # A machine may be downloading a release a request no longer names, so none younger than a day goes.
      - name: Keep the newest two releases of each requested key, and every release younger than a day
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -rs --argjson keys "$KEYS" '
            [add[] | select(.tag_name | startswith("c/")) | {tag: .tag_name, key: (.tag_name | split("/")[1]), at: .published_at}]
            | group_by(.key)[] | sort_by(.at) | reverse
            | if .[0].key | IN($keys[]) then .[2:][] else .[] end
            | select((.at | fromdateiso8601) < now - 86400) | .tag' |
          while IFS= read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
